          "@type": "Question",
          "name": "Comment ça fonctionne pour vendre un livre?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "C'est simple : crée ton compte, prends quelques photos de ton manuel, ajoute un titre, le prix et la matière, et publie ton annonce. Les acheteurs intéressés te contacteront via le chat intégré."
          }
        },
        {
          "@type": "Question",
          "name": "Est-ce que mes données sont protégées?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Absolument. Tes données sont chiffrées et stockées de manière sécurisée. Les mots de passe sont hachés, les communications sont protégées par TLS, et nous ne partageons jamais tes informations personnelles."
          }
        },
        {

          "name": "L'application est disponible sur Android?",

            "@type": "Answer",

          }
        }
